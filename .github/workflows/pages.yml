name: Publish PDF

on:
  workflow_run:
    workflows:
      - Paper CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

env:
  TEXLIVE_IMAGE: ghcr.io/xu-cheng/texlive-historic-alpine:2025
  TEXLIVE_CACHE_KEY: 2025-73a48f4fc1d3ee7357c8ea5d274af161541c0981432da33339eed7ac1f8e083d

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  preview-config:
    name: Read preview configuration
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    outputs:
      enable_public_preview: ${{ steps.config.outputs.enable_public_preview }}
      block_search_indexing: ${{ steps.config.outputs.block_search_indexing }}
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Resolve source revision
        id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            echo "sha=$WORKFLOW_RUN_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "sha=$CURRENT_SHA" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.source.outputs.sha }}

      - name: Read preview configuration
        id: config
        run: python3 scripts/read_preview_config.py --github-output "$GITHUB_OUTPUT"

  build-and-deploy:
    name: Publish online preview
    needs: preview-config
    if: needs.preview-config.outputs.enable_public_preview == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preview-config.outputs.source_sha }}

      - name: Download compiled paper from CI
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: paper-${{ needs.preview-config.outputs.source_sha }}
          path: build
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Restore cached TeX Live image
        if: github.event_name == 'workflow_dispatch'
        uses: ./.github/actions/cache-texlive
        with:
          image: ${{ env.TEXLIVE_IMAGE }}
          cache-key: ${{ env.TEXLIVE_CACHE_KEY }}

      - name: Compile paper for manual deployment
        if: github.event_name == 'workflow_dispatch'
        uses: xu-cheng/latex-action@6549dc21effb2730855a1281407ecfcececc6c1b # 4.1.0
        with:
          root_file: paper.tex
          texlive_version: 2025
          docker_image: ${{ env.TEXLIVE_IMAGE }}
          args: >-
            -pdf
            -file-line-error
            -halt-on-error
            -interaction=nonstopmode
            -synctex=1
            -outdir=build

      - name: Install PDF validator
        run: python3 -m pip install --disable-pip-version-check --requirement requirements-ci.txt

      - name: Validate build
        run: |
          python3 scripts/check_log.py build/paper.log
          python3 scripts/validate_pdf.py build/paper.pdf

      - name: Generate browser preview
        env:
          BLOCK_SEARCH_INDEXING: ${{ needs.preview-config.outputs.block_search_indexing }}
        run: |
          python3 scripts/generate_preview.py \
            --pdf build/paper.pdf \
            --output public \
            --title "LaTeX Paper Preview" \
            --repository "$GITHUB_REPOSITORY" \
            --sha "${{ needs.preview-config.outputs.source_sha }}" \
            --public-preview-enabled true \
            --block-search-indexing "$BLOCK_SEARCH_INDEXING"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
