name: Publish PDF

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build and publish online preview
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Read preview configuration
        id: preview-config
        run: python3 scripts/read_preview_config.py --github-output "$GITHUB_OUTPUT"

      - name: Compile paper
        if: steps.preview-config.outputs.enable_public_preview == 'true'
        uses: xu-cheng/latex-action@6549dc21effb2730855a1281407ecfcececc6c1b # 4.1.0
        with:
          root_file: paper.tex
          texlive_version: 2025
          args: >-
            -pdf
            -file-line-error
            -halt-on-error
            -interaction=nonstopmode
            -synctex=1
            -outdir=build

      - name: Install PDF validator
        if: steps.preview-config.outputs.enable_public_preview == 'true'
        run: python3 -m pip install --disable-pip-version-check --requirement requirements-ci.txt

      - name: Validate build
        if: steps.preview-config.outputs.enable_public_preview == 'true'
        run: |
          python3 scripts/check_log.py build/paper.log
          python3 scripts/validate_pdf.py build/paper.pdf

      - name: Generate browser preview
        env:
          ENABLE_PUBLIC_PREVIEW: ${{ steps.preview-config.outputs.enable_public_preview }}
          BLOCK_SEARCH_INDEXING: ${{ steps.preview-config.outputs.block_search_indexing }}
        run: |
          python3 scripts/generate_preview.py \
            --pdf build/paper.pdf \
            --output public \
            --title "LaTeX Paper Preview" \
            --repository "$GITHUB_REPOSITORY" \
            --sha "$GITHUB_SHA" \
            --public-preview-enabled "$ENABLE_PUBLIC_PREVIEW" \
            --block-search-indexing "$BLOCK_SEARCH_INDEXING"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
