name: Release paper

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release, for example v1.0.0
        required: true
        type: string

permissions:
  contents: write

env:
  TEXLIVE_IMAGE: ghcr.io/xu-cheng/texlive-historic-alpine:2025
  TEXLIVE_CACHE_KEY: 2025-73a48f4fc1d3ee7357c8ea5d274af161541c0981432da33339eed7ac1f8e083d

concurrency:
  group: paper-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build release assets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Resolve release tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "name=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "name=$REF_NAME" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tag.outputs.name }}
          fetch-depth: 0

      - name: Restore cached TeX Live image
        uses: ./.github/actions/cache-texlive
        with:
          image: ${{ env.TEXLIVE_IMAGE }}
          cache-key: ${{ env.TEXLIVE_CACHE_KEY }}

      - name: Compile paper
        uses: xu-cheng/latex-action@6549dc21effb2730855a1281407ecfcececc6c1b # 4.1.0
        with:
          root_file: paper.tex
          docker_image: ${{ env.TEXLIVE_IMAGE }}
          args: >-
            -pdf
            -file-line-error
            -halt-on-error
            -interaction=nonstopmode
            -synctex=1
            -outdir=build

      - name: Install PDF validator
        run: python3 -m pip install --disable-pip-version-check --requirement requirements-ci.txt

      - name: Validate and package release
        run: |
          python3 scripts/check_log.py build/paper.log
          python3 scripts/validate_pdf.py build/paper.pdf
          ./scripts/package-source.sh

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              dist/paper.pdf \
              dist/paper-source.tar.gz \
              dist/SHA256SUMS \
              --clobber
          else
            gh release create "$TAG" \
              dist/paper.pdf \
              dist/paper-source.tar.gz \
              dist/SHA256SUMS \
              --title "Paper $TAG" \
              --generate-notes \
              --verify-tag
          fi
